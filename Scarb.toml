[workspace]
members = [
    "crates/hexx",
    "crates/takeover_tests",
    "crates/consumer",
    # The golden vectors of tools/refgen, one test target per package, each held to the line
    # budget of AGENTS.md ("Golden tests") so that no test build needs more than ~8 GB (LIB-04h).
    "crates/golden_bounds",
    "crates/golden_hex",
    "crates/golden_grid",
    "crates/golden_hex_t2",
    "crates/golden_impls",
    "crates/golden_lm1",
    "crates/golden_lm2",
    "crates/golden_rings",
    "crates/golden_shapes",
]

[workspace.package]
version = "0.2.0"
edition = "2024_07"
cairo-version = "2.20.0"
license = "MIT"
repository = "https://github.com/bal7hazar/hexx-cairo"
homepage = "https://github.com/bal7hazar/hexx-cairo"
documentation = "https://github.com/bal7hazar/hexx-cairo"

[workspace.dependencies]
snforge_std = "0.64.0"

[workspace.tool.fmt]
sort-module-level-items = true
max-line-length = 100

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
