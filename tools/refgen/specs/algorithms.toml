# `hexx::algorithms::{field_of_movement, a_star}` against the board (tools/refgen/src/algorithms.rs):
# 7 x 7 and 15 x 16 boards with a closed ring (empty, and two seeded caves), 0 to 3 classes,
# budgets 0..=8 from `starts` starts, `pairs` seeded pairs of `a_star` per class count.
module = "algorithms"
package = "golden_lm2"

seed = "algorithms"
starts = 8
pairs = 32
budget_max = 8

