# `impl Hex` of milestone L-M1 (plan §4.3, brief LIB-05 M1-T2): the seeded points, every ordered
# pair of them, and the i32 values near the bounds (tools/refgen/src/hex.rs).
module = "hex"
package = "hexx"

seed = "hex::points"
points = 64
domain_min = -40
domain_max = 40
chunks = 8        # the 64 x 64 ordered pairs, in this many tests
panic_cap = 4     # #[should_panic] tests per function near the bounds
