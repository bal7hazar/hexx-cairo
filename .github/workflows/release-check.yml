name: Release check

# D-132 (fix loop 2, decision A): no agent and no workflow publishes. A publication is made by the
# orchestrator session, from a clean checkout of a named commit, after a go of the project manager
# that names package, version and commit; the tag and the GitHub release come only after the
# registry shows the version. This workflow is the project manager's evidence for that go: it
# checks out exactly the named commit, verifies it against `main` and the manifest, runs the full
# local gate with the golden-vector check mandatory, verifies the milestone the version implies is
# actually met (enforced for a stable version, informational for a pre-release — fix loop 3
# decision P2-13, plan §9.1/§9.2), packages the crate, and uploads what a reviewer needs to inspect
# the result — nothing more. It never publishes: no `environment:`, no secret, no `scarb publish`,
# anywhere in this workflow or any other of this repository. See docs/RELEASING.md.
#
# Only a run whose *own workflow revision* is `refs/heads/main` counts as evidence for a go (fix
# loop 3 decision P2-2): `workflow_dispatch` lets any branch be selected as "Use workflow from",
# and a modified copy of this file on another branch could weaken or remove every guard below
# while still checking out a legitimate `main` commit afterward. The first step below fails the
# run before anything else happens unless GitHub itself resolved this run against `main`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check (must equal Scarb.toml's [workspace.package] version)"
        required: true
        type: string
      sha:
        description: "Full 40-character commit hash to check out (must be an ancestor of origin/main)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-check
  cancel-in-progress: false

jobs:
  release-check:
    name: Release check of crates/hexx
    runs-on: ubuntu-latest
    # The full local gate runs every test unpartitioned, then again for the gas gate: it outgrew
    # 20 minutes with M1-T6's oracles (run 36807402272, cancelled after 19 m 55 s in that step).
    # A manual, rare run; the 10-minute target is for the partitioned CI of pull requests.
    timeout-minutes: 120
    steps:
      # `GITHUB_REF` is already a shell environment variable GitHub Actions itself sets (never a
      # `${{ }}` expression interpolated into this script), so reading it directly is already
      # "through env, quoted" — fix loop 3 decision P2-2.
      - name: Verify this run's own workflow revision is refs/heads/main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::this workflow must be dispatched from refs/heads/main (was $GITHUB_REF); a run from another branch is not evidence for a go"
            exit 1
          fi

      - name: Verify the input sha is a full commit hash
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$SHA' is not a 40-character lowercase hex commit hash"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out exactly the input sha
        env:
          SHA: ${{ inputs.sha }}
        run: git checkout --quiet "$SHA"

      - name: Verify the checked-out commit is exactly the input sha
        env:
          SHA: ${{ inputs.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$SHA" ]; then
            echo "::error::checked out $actual, expected $SHA"
            exit 1
          fi

      - name: Verify the sha is an ancestor of origin/main
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main"
            exit 1
          fi

      - name: Verify the input version matches the manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          manifest_version=$(awk -F'"' '/^version = /{print $2; exit}' Scarb.toml)
          if [ -z "$manifest_version" ]; then
            echo "::error::could not read [workspace.package].version from Scarb.toml"
            exit 1
          fi
          if [ "$VERSION" != "$manifest_version" ]; then
            echo "::error::input version '$VERSION' does not match Scarb.toml's '$manifest_version'"
            exit 1
          fi

      - name: Verify the version has valid semver syntax
        env:
          VERSION: ${{ inputs.version }}
        run: |
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $semver_re ]]; then
            echo "::error::'$VERSION' is not valid semver"
            exit 1
          fi

      # `git ls-remote --exit-code` returns 0 (a match: the tag exists), 2 (no match: the tag is
      # absent), or another code for a transport/auth failure — fix loop 3 finding 17: treating
      # every nonzero code as "absent" (the previous design) let a network error silently pass
      # this guard instead of failing the job closed.
      - name: Verify no tag v<version> exists yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::could not determine whether tag v$VERSION exists (git ls-remote exited $status)"
            exit 1
          fi

      # docs/RELEASING.md's table (0.1.x -> L-M1, 0.2.x -> L-M2, 0.3.x -> L-M3, 1.x -> L-M4).
      - name: Derive the milestone the version implies
        id: milestone
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            0.1.*) milestone=L-M1 ;;
            0.2.*) milestone=L-M2 ;;
            0.3.*) milestone=L-M3 ;;
            1.*) milestone=L-M4 ;;
            *)
              echo "::error::'$VERSION' has no milestone mapping (0.1.x -> L-M1, 0.2.x -> L-M2, 0.3.x -> L-M3, 1.x -> L-M4)"
              exit 1
              ;;
          esac
          echo "milestone=$milestone" >> "$GITHUB_OUTPUT"

      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.19.4"
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: "0.61.0"
      # The golden-vector check (tools/refgen) is mandatory here, unlike a job with no Rust
      # toolchain: `scripts/check.sh` refuses to skip it silently once cargo is on PATH.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Run the full local gate (golden vectors mandatory)
        run: scripts/check.sh

      # A pre-release version (a hyphen in the part before any `+`, `0.1.0-rc.N`) carries only part
      # of the milestone it maps to (`docs/RELEASING.md`: `0.1.0-rc.1` lacks N-1, N-2 and N-6; the full L-M1
      # is due only at the stable `0.1.0`, §9.2) — the gate is informational for it, not
      # enforced; any other version enforces it. Whether a version is a pre-release is decided by
      # `scripts/api_parity.py --is-prerelease` (unit-tested; `0.1.0+build-1` is stable), never by
      # a pattern here. `--report-only` is `scripts/api_parity.py`'s own, tested option, never a
      # `|| true` here, which would as readily hide a real failure of a stable-version release.
      # The whole missing-item listing (if any) goes to the job summary and the uploaded artifact
      # either way — stdout and stderr both captured, the summary written even when the check
      # fails — so a reviewer sees exactly what is still open.
      - name: Verify the milestone the version implies is met
        id: milestone_check
        env:
          MILESTONE: ${{ steps.milestone.outputs.milestone }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          # The reports go to the runner's temporary directory, never into the checkout:
          # `scarb package` refuses a tree with an untracked file (run 36809681077).
          out="$RUNNER_TEMP/release-check"
          mkdir -p "$out"
          prerelease=$(python3 scripts/api_parity.py --is-prerelease "$VERSION")
          status=0
          if [ "$prerelease" = "true" ]; then
            python3 scripts/api_parity.py --check-release "$MILESTONE" --report-only 2>&1 \
              | tee "$out/milestone-report.txt" || status=$?
          else
            python3 scripts/api_parity.py --check-release "$MILESTONE" 2>&1 \
              | tee "$out/milestone-report.txt" || status=$?
          fi
          cat "$out/milestone-report.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Names any file the gate left in the checkout before `scarb package` refuses it.
      - name: Verify the checkout is clean
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::the checkout is not clean after the gate; scarb package would refuse it:"
            echo "$dirty"
            exit 1
          fi

      - name: Package crates/hexx
        run: scarb package -p hexx

      # The packaged manifest and a listing of the archive's contents, not the archive itself
      # (never published from a workflow; a reviewer inspecting names and sizes does not need the
      # compressed bytes, and this workflow keeps no build artifact larger than it must).
      - name: List the packaged archive
        run: |
          out="$RUNNER_TEMP/release-check"
          tar --zstd -tvf target/package/hexx-*.tar.zst > "$out/archive-listing.txt"
          tar --zstd -xOf target/package/hexx-*.tar.zst --wildcards '*/Scarb.toml' > "$out/Scarb.toml"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexx-release-check-${{ inputs.version }}
          path: ${{ runner.temp }}/release-check/
          if-no-files-found: error
          retention-days: 30
