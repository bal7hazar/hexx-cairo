name: Publish

# Manual, `main`-only, owner-only (fix loop 1, findings 1 and 2 — the orchestrator's fix, not the
# auditor's suggested one): no tag triggers this. Every guard below is its own step, before
# anything else runs, so a failure names exactly which precondition was not met:
#   - the ref is refs/heads/main (never a branch, never a fork's ref);
#   - the actor is the repository owner (github.actor == github.repository_owner);
#   - the `version` input equals the version the manifest actually declares;
#   - no tag `v<version>` exists yet on the remote (this workflow never creates one: the
#     orchestrator tags by hand, after a successful publish — permissions stay `contents: read`,
#     this workflow cannot write to the repository).
# `environment: publish` is the other half of the gate: a required reviewer and the registry
# token, both settings of the repository owner that no workflow can create — see
# docs/RELEASING.md. Rehearsed by LIB-04 up to `scarb package` only: `scarb publish` was never
# run by that task (its profile refuses it); see docs/reports/LIB-04-REPORT.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal Scarb.toml's [workspace.package] version)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish crates/hexx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the ref is refs/heads/main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::this workflow must run from refs/heads/main, not ${{ github.ref }}"
            exit 1
          fi

      - name: Verify the actor is the repository owner
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "::error::only ${{ github.repository_owner }} may run this workflow (actor: ${{ github.actor }})"
            exit 1
          fi

      - name: Verify the input version matches the manifest
        run: |
          manifest_version=$(awk -F'"' '/^version = /{print $2; exit}' Scarb.toml)
          if [ -z "$manifest_version" ]; then
            echo "::error::could not read [workspace.package].version from Scarb.toml"
            exit 1
          fi
          if [ "${{ inputs.version }}" != "$manifest_version" ]; then
            echo "::error::input version '${{ inputs.version }}' does not match Scarb.toml's '$manifest_version'"
            exit 1
          fi

      - name: Verify no tag v<version> exists yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.19.4"
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: "0.61.0"
      # The full local gate: format, build, test every package, the parity/deviations/gas/class
      # size checks. Skips the golden-vector check only if CHECK_SKIP_GOLDEN=1 is set (this job
      # does not install Rust, so that check is the golden CI job's, run on every pull request
      # already merged before this workflow can be dispatched).
      - name: Run the checks
        env:
          CHECK_SKIP_GOLDEN: "1"
        run: scripts/check.sh
      - name: Package crates/hexx
        run: scarb package -p hexx
      - name: Publish crates/hexx
        env:
          SCARB_REGISTRY_AUTH_TOKEN: ${{ secrets.SCARB_REGISTRY_AUTH_TOKEN }}
        run: scarb publish -p hexx
