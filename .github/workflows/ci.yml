name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Links between files of the repository only: external sites are not a gate.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/*.sh

  fmt:
    name: Format and parity/deviations/gas docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.19.4"
      - run: scarb fmt --check --workspace
      - run: python3 -m unittest discover -s scripts/tests
      # docs/API_PARITY.md must match the embedded hexx 0.25.0 inventory (regenerate with
      # `python3 scripts/api_parity.py --refresh --hexx /path/to/hexx`).
      - run: python3 scripts/api_parity.py --check
      # docs/EXTENSIONS.md must match the extension modules of crates/hexx/src (none yet).
      - run: python3 scripts/api_parity.py --extensions --check
      # docs/DEVIATIONS.md must match the `#### Deviations` doc comments of crates/hexx/src.
      - run: python3 scripts/deviations.py --check
      # docs/GAS.md must match gas/*.snap (regenerate with `python3 scripts/gas_tables.py`).
      - run: python3 scripts/gas_tables.py --check

  takeover:
    name: Take-over of origami_hexmap is a move
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.19.4"
      # Read-only checkout of the source at the commit of sources/VERSIONS.md, outside the repository.
      - name: Fetch dojoengine/origami at the pinned commit
        run: |
          git init --quiet "$RUNNER_TEMP/origami"
          git -C "$RUNNER_TEMP/origami" fetch --quiet --depth 1 https://github.com/dojoengine/origami.git 04ab30caf02dcc8d2ecc46e9596b81732eedcec1
          git -C "$RUNNER_TEMP/origami" checkout --quiet FETCH_HEAD
      - run: python3 scripts/takeover_check.py --source "$RUNNER_TEMP/origami/crates/hexmap"

  test:
    # hexx runs in two partitions of snforge (`--partition INDEX/TOTAL`): its tests took 452 to
    # 615 s in one job, too close to the 10-minute limit (orchestrator, 2026-09-30).
    name: Build and test ${{ matrix.package }} ${{ matrix.partition }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: hexx, partition: "1/2" }
          - { package: hexx, partition: "2/2" }
          - { package: takeover_tests, partition: "1/1" }
          - { package: consumer, partition: "1/1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.19.4"
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: "0.61.0"
      - env:
          PACKAGE: ${{ matrix.package }}
        run: scarb build -p "$PACKAGE"
      - env:
          PACKAGE: ${{ matrix.package }}
          PARTITION: ${{ matrix.partition }}
        run: snforge test -p "$PACKAGE" --partition "$PARTITION"

  package:
    name: Package crates/hexx (rehearsal, never scarb publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.19.4"
      # `scarb package` alone (never `scarb publish`, never a token): lets a reviewer download
      # and inspect exactly what a release would ship, on every pull request, without re-running
      # it themselves — fix loop 1 finding 11 (the audit could not reach the archive this task's
      # own report described, since `target/package/` is a build artifact, gitignored, and not
      # otherwise preserved anywhere a reviewer can reach).
      - run: scarb package -p hexx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexx-package-${{ github.sha }}
          path: |
            target/package/hexx-*/Scarb.toml
            target/package/hexx-*.tar.zst
          if-no-files-found: error
          retention-days: 30

  # One job per package (M1-T1c): each measures its own package and checks it against its own
  # gas/<package>.snap, so that the time of the gate does not grow with the sum of the packages.
  # `hexx` is two jobs, its tests without `#[ignore]` and its ignored tests (103, the printouts
  # and benchmarks): measured together they took 9 m 45 s of the 10 minutes (6 m 32 s without),
  # measured apart each is far under. Every test is measured in one of them.
  gas:
    name: Gas ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: hexx, scope: regular, label: hexx}
          - {package: hexx, scope: ignored, label: hexx (ignored tests)}
          - {package: takeover_tests, scope: all, label: takeover_tests}
          - {package: consumer, scope: all, label: consumer}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.19.4"
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: "0.61.0"
      # Fails when a test has no #[available_gas], when its budget is above the ceiling of its
      # measurement (a fuzz test: its maximum), when a test ran with no parsable measurement, when
      # the counts declared / collected / with a row / ignored disagree, or when
      # gas/<package>.snap is stale (commit `python3 scripts/bench.py snapshot`). No test is
      # exempt. On a mismatch it prints the test, both figures and where the evidence is.
      - name: Check gas budgets and snapshot
        env:
          PACKAGE: ${{ matrix.package }}
          SCOPE: ${{ matrix.scope }}
        run: |
          set -o pipefail
          python3 scripts/bench.py check --package "$PACKAGE" --scope "$SCOPE" | tee gas_report.md
      # The tests of Digger, twice in the same job on the same compiled code: two measurements
      # that differ fail the job (the drift seen in two runs went through Digger::dig). It runs
      # even when the check failed, the second measurement being evidence. `consumer` has none,
      # and the ignored tests of `hexx` are not Digger's.
      - name: Double run of the Digger tests
        if: ${{ !cancelled() && matrix.package != 'consumer' && matrix.scope != 'ignored' }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: python3 scripts/bench.py repeat --package "$PACKAGE" --filter digger
      # Fails on any class size change of crates/consumer not committed in gas/bytecode.size.
      - name: Check bytecode size
        if: ${{ matrix.package == 'consumer' }}
        run: |
          set -o pipefail
          python3 scripts/bytecode_size.py check | tee -a gas_report.md
      - name: Publish gas report
        if: always()
        run: cat gas_report.md >> "$GITHUB_STEP_SUMMARY"
      # The evidence of the run, kept whatever the outcome: the raw output of
      # `snforge test --detailed-resources`, the SHA-256 of the compiled test files it executed
      # (artifacts-<run>.sha256, one per run: the check and each repeat), the versions of scarb,
      # snforge and of the Sierra compiler (versions.txt), and the raw output of each run
      # (snforge-<run>.txt: the check, the two runs of the Digger tests).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gas-${{ matrix.package }}-${{ matrix.scope }}-${{ github.sha }}
          path: target/gas-artifacts/${{ matrix.package }}
          if-no-files-found: warn
          retention-days: 30

  golden:
    name: Golden vectors up to date (tools/refgen)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The stable Rust toolchain is preinstalled on ubuntu-latest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/refgen/target
          key: refgen-${{ runner.os }}-${{ hashFiles('tools/refgen/Cargo.lock') }}
      - name: Build against hexx = "=0.25.0"
        run: cargo build --locked --manifest-path tools/refgen/Cargo.toml
      # Fails when a committed crates/hexx/tests/golden_*.cairo differs from the generator output.
      - name: Check golden vectors
        run: cargo run --locked --manifest-path tools/refgen/Cargo.toml -- check

  all-checks:
    name: All checks passed
    if: always()
    needs: [links, scripts, fmt, takeover, test, package, gas, golden]
    runs-on: ubuntu-latest
    steps:
      - env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$HAS_FAILURE" = "true" ] || [ "$HAS_CANCELLED" = "true" ]; then
            exit 1
          fi
