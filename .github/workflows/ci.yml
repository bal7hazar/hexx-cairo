name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# D-176: the compiler places the `withdraw_gas` check of a call-graph cycle by salsa intern-id
# order, which follows rayon's thread order; on one thread a build is one build (D-154). Set once
# for the workflow, so that every build a gate measures or declares (test, package, gas, class
# size, determinism) is that one build.
env:
  RAYON_NUM_THREADS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # LIB-04g: which jobs the pull request needs (scripts/ci_changes.py). Any other event than a pull
  # request (a push to main) selects every group without computing anything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      links: ${{ steps.groups.outputs.links }}
      shell: ${{ steps.groups.outputs.shell }}
      docs_checks: ${{ steps.groups.outputs.docs_checks }}
      takeover: ${{ steps.groups.outputs.takeover }}
      cairo: ${{ steps.groups.outputs.cairo }}
      golden: ${{ steps.groups.outputs.golden }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [ "$EVENT" = "pull_request" ]; then
            # Fail open: a diff that cannot be computed gives an empty list, which selects every group.
            { git diff --name-only "$BASE_SHA...$HEAD_SHA" || true; } | python3 scripts/ci_changes.py | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_changes.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  links:
    name: Markdown links
    needs: changes
    if: needs.changes.outputs.links != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Links between files of the repository only: external sites are not a gate.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  scripts:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.shell != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/*.sh

  fmt:
    name: Format and parity/deviations/gas docs
    needs: changes
    if: needs.changes.outputs.docs_checks != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb
        continue-on-error: true
      - name: Retry setup-scarb (the download failed)
        if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - run: scarb fmt --check --workspace
      - run: python3 -m unittest discover -s scripts/tests
      # docs/API_PARITY.md must match the embedded hexx 0.25.0 inventory (regenerate with
      # `python3 scripts/api_parity.py --refresh --hexx /path/to/hexx`).
      - run: python3 scripts/api_parity.py --check
      # docs/EXTENSIONS.md must match the extension modules of crates/hexx/src (none yet).
      - run: python3 scripts/api_parity.py --extensions --check
      # docs/DEVIATIONS.md must match the `#### Deviations` doc comments of crates/hexx/src.
      - run: python3 scripts/deviations.py --check
      # docs/GAS.md must match gas/*.snap (regenerate with `python3 scripts/gas_tables.py`).
      - run: python3 scripts/gas_tables.py --check

  takeover:
    name: Take-over of origami_hexmap is a move
    needs: changes
    if: needs.changes.outputs.takeover != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb
        continue-on-error: true
      - name: Retry setup-scarb (the download failed)
        if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      # Read-only checkout of the source at the commit of sources/VERSIONS.md, outside the repository.
      - name: Fetch dojoengine/origami at the pinned commit
        run: |
          git init --quiet "$RUNNER_TEMP/origami"
          git -C "$RUNNER_TEMP/origami" fetch --quiet --depth 1 https://github.com/dojoengine/origami.git 04ab30caf02dcc8d2ecc46e9596b81732eedcec1
          git -C "$RUNNER_TEMP/origami" checkout --quiet FETCH_HEAD
      - run: python3 scripts/takeover_check.py --source "$RUNNER_TEMP/origami/crates/hexmap"

  test:
    # hexx runs in six partitions of snforge (`--partition INDEX/TOTAL`): its tests took 452 to
    # 615 s in one job, 6 m 49 s in each of two, and 3 m 57 s to 6 m 14 s in each of three and 5 m 34 s to 6 m 0 s in each of four (LIB-04c: the
    # partition is by hash, so the shares are uneven), and M1-T6 adds more.
    name: Build and test ${{ matrix.package }} ${{ matrix.partition }}
    needs: changes
    if: needs.changes.outputs.cairo != 'false'
    runs-on: ubuntu-latest
    # 20 minutes since LIB-04e (D-176): on one thread the compile of a partition more than doubles
    # (execution is unchanged); 10 minutes was the track's target, one reproducible build is worth more.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: hexx, partition: "1/6" }
          - { package: hexx, partition: "2/6" }
          - { package: hexx, partition: "3/6" }
          - { package: hexx, partition: "4/6" }
          - { package: hexx, partition: "5/6" }
          - { package: hexx, partition: "6/6" }
          - { package: takeover_tests, partition: "1/1" }
          - { package: consumer, partition: "1/1" }
          # The golden vectors of tools/refgen (LIB-04h): one package per test target, so that no
          # compile needs more than ~8 GB (AGENTS.md, "Golden tests").
          - { package: golden_hex, partition: "1/1" }
          - { package: golden_hex_t2, partition: "1/1" }
          - { package: golden_impls, partition: "1/1" }
          - { package: golden_lm1, partition: "1/1" }
          - { package: golden_lm2, partition: "1/1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb
        continue-on-error: true
      - name: Retry setup-scarb (the download failed)
        if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        id: snfoundry
        continue-on-error: true
      - name: Retry setup-snfoundry (the download failed)
        if: steps.snfoundry.outcome == 'failure'
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      - env:
          PACKAGE: ${{ matrix.package }}
        run: scarb build -p "$PACKAGE"
      - env:
          PACKAGE: ${{ matrix.package }}
          PARTITION: ${{ matrix.partition }}
        run: snforge test -p "$PACKAGE" --partition "$PARTITION"

  package:
    name: Package crates/hexx (rehearsal, never scarb publish)
    needs: changes
    if: needs.changes.outputs.cairo != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb
        continue-on-error: true
      - name: Retry setup-scarb (the download failed)
        if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      # `scarb package` alone (never `scarb publish`, never a token): lets a reviewer download
      # and inspect exactly what a release would ship, on every pull request, without re-running
      # it themselves — fix loop 1 finding 11 (the audit could not reach the archive this task's
      # own report described, since `target/package/` is a build artifact, gitignored, and not
      # otherwise preserved anywhere a reviewer can reach).
      - run: scarb package -p hexx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexx-package-${{ github.sha }}
          path: |
            target/package/hexx-*/Scarb.toml
            target/package/hexx-*.tar.zst
          if-no-files-found: error
          retention-days: 30

  # One job per package (M1-T1c): each measures its own package and checks it against its own
  # gas/<package>.snap, so that the time of the gate does not grow with the sum of the packages.
  # `hexx` is two scopes, its tests without `#[ignore]` and its ignored tests (103, the printouts
  # and benchmarks): measured together they took 9 m 45 s of the 10 minutes (6 m 32 s without),
  # measured apart each is far under. The regular scope is in six partitions and the ignored one
  # in three (LIB-04c: the jobs took 9 m 4 s and 6 m 1 s; six since 2026-10-01, when four reached 7 m 25 s), each checked against its own snapshot rows; the jobs `Gas completeness` after
  # them fails when a test was measured in no partition or in two, or a row is stale. Every test
  # is measured exactly once.
  gas:
    name: Gas ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.cairo != 'false'
    runs-on: ubuntu-latest
    # 20 minutes since LIB-04e (D-176), as the `test` job: the pinned compile.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: hexx, scope: regular, partition: "1/6", tag: -p1of6, label: hexx 1/6}
          - {package: hexx, scope: regular, partition: "2/6", tag: -p2of6, label: hexx 2/6}
          - {package: hexx, scope: regular, partition: "3/6", tag: -p3of6, label: hexx 3/6}
          - {package: hexx, scope: regular, partition: "4/6", tag: -p4of6, label: hexx 4/6}
          - {package: hexx, scope: regular, partition: "5/6", tag: -p5of6, label: hexx 5/6}
          - {package: hexx, scope: regular, partition: "6/6", tag: -p6of6, label: hexx 6/6}
          - {package: hexx, scope: ignored, partition: "1/3", tag: -p1of3, label: hexx ignored 1/3}
          - {package: hexx, scope: ignored, partition: "2/3", tag: -p2of3, label: hexx ignored 2/3}
          - {package: hexx, scope: ignored, partition: "3/3", tag: -p3of3, label: hexx ignored 3/3}
          - {package: takeover_tests, scope: all, label: takeover_tests}
          - {package: consumer, scope: all, label: consumer}
          - {package: golden_hex, scope: all, label: golden_hex}
          - {package: golden_hex_t2, scope: all, label: golden_hex_t2}
          - {package: golden_impls, scope: all, label: golden_impls}
          - {package: golden_lm1, scope: all, label: golden_lm1}
          - {package: golden_lm2, scope: all, label: golden_lm2}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb
        continue-on-error: true
      - name: Retry setup-scarb (the download failed)
        if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        id: snfoundry
        continue-on-error: true
      - name: Retry setup-snfoundry (the download failed)
        if: steps.snfoundry.outcome == 'failure'
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
      # Fails when a test has no #[available_gas], when its budget is above the ceiling of its
      # measurement (a fuzz test: its maximum), when a test ran with no parsable measurement, when
      # the counts declared / collected / with a row / ignored disagree, or when
      # gas/<package>.snap is stale (commit `python3 scripts/bench.py snapshot`). No test is
      # exempt. On a mismatch it prints the test, both figures and where the evidence is.
      - name: Check gas budgets and snapshot
        env:
          PACKAGE: ${{ matrix.package }}
          SCOPE: ${{ matrix.scope }}
          PARTITION: ${{ matrix.partition }}
        run: |
          set -o pipefail
          python3 scripts/bench.py check --package "$PACKAGE" --scope "$SCOPE" ${PARTITION:+--partition "$PARTITION"} | tee gas_report.md
      # The tests of Digger, twice in the same job on the same compiled code: two measurements
      # that differ fail the job (the drift seen in two runs went through Digger::dig). It runs
      # even when the check failed, the second measurement being evidence. `consumer` and the
      # golden packages have none, and the ignored tests of `hexx` are not Digger's. In a
      # partition it runs the Digger tests of that share, so that each runs twice once over the
      # partitions.
      - name: Double run of the Digger tests
        if: ${{ !cancelled() && matrix.package != 'consumer' && !startsWith(matrix.package, 'golden_') && matrix.scope != 'ignored' }}
        env:
          PACKAGE: ${{ matrix.package }}
          PARTITION: ${{ matrix.partition }}
        run: python3 scripts/bench.py repeat --package "$PACKAGE" --filter digger ${PARTITION:+--partition "$PARTITION"}
      # Fails on any class size change of crates/consumer not committed in gas/bytecode.size.
      - name: Check bytecode size
        if: ${{ matrix.package == 'consumer' }}
        run: |
          set -o pipefail
          python3 scripts/bytecode_size.py check | tee -a gas_report.md
      - name: Publish gas report
        if: always()
        run: cat gas_report.md >> "$GITHUB_STEP_SUMMARY"
      # The evidence of the run, kept whatever the outcome: the raw output of
      # `snforge test --detailed-resources`, the SHA-256 of the compiled test files it executed
      # (artifacts-<run>.sha256, one per run: the check and each repeat), the versions of scarb,
      # snforge and of the Sierra compiler (versions.txt), and the raw output of each run
      # (snforge-<run>.txt: the check, the two runs of the Digger tests).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gas-${{ matrix.package }}-${{ matrix.scope }}${{ matrix.tag }}-${{ github.sha }}
          path: target/gas-artifacts/${{ matrix.package }}
          if-no-files-found: warn
          retention-days: 30

  # After the partitions of `hexx` (each scope): every test of the scope measured in exactly one of
  # them, and no row of gas/hexx.snap that none measured (scripts/bench.py `complete`). It reads
  # the `partition-*.json` each partition job keeps in its artefact. It runs when a partition
  # failed too, so that the two reports do not hide each other.
  gas-complete:
    name: Gas completeness hexx ${{ matrix.scope }}
    needs: [changes, gas]
    if: ${{ !cancelled() && needs.changes.outputs.cairo != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scope: regular, total: 6}
          - {scope: ignored, total: 3}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the partition reports
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ matrix.scope }}
          TOTAL: ${{ matrix.total }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "gas-hexx-$SCOPE-p*of$TOTAL-${{ github.sha }}" --dir partition-reports
      - env:
          SCOPE: ${{ matrix.scope }}
          TOTAL: ${{ matrix.total }}
        run: python3 scripts/bench.py complete --package hexx --scope "$SCOPE" --total "$TOTAL" --reports partition-reports

  # D-176: the proof that a clean build is one build. `crates/consumer` is built three times from
  # clean (`scarb clean` between, release profile as the class-size check, RAYON_NUM_THREADS=1 from
  # the workflow's `env:`); the job fails when the SHA-256 of a contract's Sierra class file or of
  # its CASM class file (the class hash is a function of the Sierra class) or the table of sizes
  # differs between two builds.
  determinism:
    name: Three clean builds of consumer give one class
    needs: changes
    if: needs.changes.outputs.cairo != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        id: scarb
        continue-on-error: true
      - name: Retry setup-scarb (the download failed)
        if: steps.scarb.outcome == 'failure'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
      - name: Build three times from clean and compare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/determinism"
          for i in 1 2 3; do
            scarb clean
            scarb --release build -p consumer
            (cd target/release && sha256sum consumer_*.contract_class.json consumer_*.compiled_contract_class.json) > "$RUNNER_TEMP/determinism/hashes-$i.txt"
            python3 scripts/bytecode_size.py table > "$RUNNER_TEMP/determinism/sizes-$i.md" 2>/dev/null
          done
          cat "$RUNNER_TEMP/determinism/hashes-1.txt"
          for i in 2 3; do
            diff "$RUNNER_TEMP/determinism/hashes-1.txt" "$RUNNER_TEMP/determinism/hashes-$i.txt"
            diff "$RUNNER_TEMP/determinism/sizes-1.md" "$RUNNER_TEMP/determinism/sizes-$i.md"
          done
          echo "three clean builds, one class" | tee -a "$GITHUB_STEP_SUMMARY"

  golden:
    name: Golden vectors up to date (tools/refgen)
    needs: changes
    if: needs.changes.outputs.golden != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The stable Rust toolchain is preinstalled on ubuntu-latest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/refgen/target
          key: refgen-${{ runner.os }}-${{ hashFiles('tools/refgen/Cargo.lock') }}
      - name: Build against hexx = "=0.25.0"
        run: cargo build --locked --manifest-path tools/refgen/Cargo.toml
      # Fails when a committed crates/golden_*/tests/golden_*.cairo differs from the generator output.
      - name: Check golden vectors
        run: cargo run --locked --manifest-path tools/refgen/Cargo.toml -- check

  all-checks:
    name: All checks passed
    if: always()
    needs: [changes, links, scripts, fmt, takeover, test, package, gas, gas-complete, determinism, golden]
    runs-on: ubuntu-latest
    steps:
      # A skipped job passes (its files did not change); `changes` itself must have succeeded.
      - env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          CHANGES: ${{ needs.changes.result }}
          GROUPS_OUT: ${{ join(needs.changes.outputs.*, ' ') }}
        run: |
          # Every output of `changes` must be `true` or `false`: a missing one means the script
          # did not run, and no job may be skipped on that silence.
          for g in $GROUPS_OUT; do
            if [ "$g" != "true" ] && [ "$g" != "false" ]; then exit 1; fi
          done
          if [ -z "$GROUPS_OUT" ] || [ "$(echo "$GROUPS_OUT" | wc -w)" != "6" ]; then exit 1; fi
          if [ "$HAS_FAILURE" = "true" ] || [ "$HAS_CANCELLED" = "true" ] || [ "$CHANGES" != "success" ]; then
            exit 1
          fi
